# Builds the site and deploys it to GitHub Pages.
# One-time repo setting: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a deploy that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Repository variables (Settings → Secrets and variables → Actions → Variables). The build
    # and the "Verify built site" step must see the same values, so they are set once here.
    # TIMEZONE is set only where it is used, so the unit tests always run with the default.
    env:
      ALLOW_INDEXING: ${{ vars.ALLOW_INDEXING || 'false' }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Restore image cache
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-images-${{ runner.os }}-${{ hashFiles('src/albums/**') }}
          restore-keys: |
            astro-images-${{ runner.os }}-

      - name: Check photos and metadata
        run: npm run photos:check
        env:
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Singapore' }}

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The repository variables SITE_URL / BASE_PATH override the values detected from
          # the Pages configuration (needed only for unusual setups).
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          BASE_PATH: ${{ vars.BASE_PATH || format('{0}/', steps.pages.outputs.base_path) }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Singapore' }}

      # No EXIF/GPS in published images, no copies of original photos, no broken links,
      # no drafts or hidden photos, robots/takedown line on every page, JS budget.
      # Must use the same BASE_PATH (and the job-level variables above) as the build.
      - name: Verify built site
        run: npm run verify:dist
        env:
          BASE_PATH: ${{ vars.BASE_PATH || format('{0}/', steps.pages.outputs.base_path) }}

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
